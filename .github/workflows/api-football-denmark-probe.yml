name: API-Football Denmark Probe

on:
  workflow_dispatch:
    inputs:
      season:
        description: "API-Football season to inspect"
        required: true
        default: "2026"
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe Danish coverage
        env:
          API_FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_API_KEY }}
          API_FOOTBALL_SEASON: ${{ inputs.season }}
        run: python3 scripts/check-api-football-denmark.py
